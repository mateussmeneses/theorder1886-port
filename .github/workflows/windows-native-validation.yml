name: Windows CLANG64 native build and tests

# No proprietary game files or local saves are required.
# Runs on every PR and push to master so the required `gate` check always reports; the full
# build only runs when code changed (docs-only changes pass the gate without it).
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "$changed"
          if grep -qvE '^(docs/|README|LICENSE|.*\.md$)' <<<"$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  clang64:
    name: Full Windows build and native/Python unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Preserve LF on checkout
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install CLANG64 build and runtime dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-tk
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross

      - name: Check checkout and toolchain
        run: |
          set -euo pipefail
          test "$MSYSTEM" = CLANG64
          clang++ --version
          cmake --version
          ninja --version
          python --version
          git submodule status --recursive
          test -f gpu/third_party/imgui/imgui.h
          test -f gpu/third_party/fsr-vulkan/CMakeLists.txt
          test -f gpu/third_party/xbyak/xbyak/xbyak.h

      - name: Verify toolchain stays on the active MSYS2 installation
        run: |
          set -euo pipefail
          active_clang="$(command -v clang++)"
          active_timeout="$(command -v timeout)"
          source ./msys2-env.sh
          selected_clang="$(command -v clang++)"
          selected_timeout="$(command -v timeout)"
          echo "Compiler: $active_clang -> $selected_clang"
          echo "Timeout: $active_timeout -> $selected_timeout"
          if [[ "$active_clang" != "$selected_clang" ||
                "$active_timeout" != "$selected_timeout" ]]; then
            echo "::error::msys2-env.sh selected a different toolchain runtime"
            exit 1
          fi

      - name: Build port for Windows (no game data)
        run: |
          set -euo pipefail
          mkdir -p out
          echo "Native build begins; verbose shell trace enabled for unexpected exit codes"
          if ! bash -x build.sh > out/ci-build-trace.log 2>&1; then
            echo "::error::build.sh failed; last shell commands:"
            tail -100 out/ci-build-trace.log || true
            echo "Outputs available after failure:"
            ls -lh out/gpu/*.exe out/*.exe 2>/dev/null || true
            echo "Ninja log tail:"
            tail -70 out/gpu-build.log || true
            exit 1
          fi
          echo "build.sh completed; checking required native products"
          test -s out/theorder-probe.exe
          test -s out/theorder-gpu-capabilities.exe

      - name: Diagnose executable invocation before full suite
        run: |
          set -uo pipefail
          command -v timeout || true
          command -v clang++ || true
          ninja -C out/gpu buffer-addr64-test
          set +e
          ./out/gpu/buffer-addr64-test.exe
          direct=$?
          timeout 10 ./out/gpu/buffer-addr64-test.exe
          timed_exe=$?
          timeout 10 out/gpu/buffer-addr64-test
          timed_name=$?
          set -e
          echo "Native test exit codes: direct=$direct timed-exe=$timed_exe timed-name=$timed_name"
          if [[ "$direct" -ne 0 || "$timed_exe" -ne 0 || "$timed_name" -ne 0 ]]; then
            echo "::error::Native C++ tests are not starting; inspect the numeric exit codes and Windows DLL environment."
            exit 1
          fi

      - name: Run all CPU/IR tests and GPU tests only when a Vulkan ICD exists
        env:
          # GitHub-hosted Windows runners have no compatible Vulkan ICD/GPU.
          # Preflight exits 77 ONLY for proven device absence; all other
          # errors and all non-GPU tests remain failures.
          THEORDER_VULKAN_TESTS: auto
        run: |
          set -euo pipefail
          bash tools/run_tests.sh

      - name: Save non-player text diagnostics if build/tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-failure-logs
          path: |
            out/gpu-build.log
            out/ci-build-trace.log
            out/tests-build.log
            out/test-*.log
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: gate
    needs: [changes, clang64]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          echo "changes=${{ needs.changes.result }} code=${{ needs.changes.outputs.code }} clang64=${{ needs.clang64.result }}"
          [[ "${{ needs.changes.result }}" == "success" ]] || exit 1
          [[ "${{ needs.clang64.result }}" == "success" || "${{ needs.clang64.result }}" == "skipped" && "${{ needs.changes.outputs.code }}" == "false" ]] || exit 1
