# Fixed settings for the release baseline (tools/bench/baseline.py). Never the user's theorder.ini.
# 1080p, windowed, vsync on, 60 cap, upscaler off, 60 FPS engine patch (the game's own rate).
display_mode=windowed
output_res=1920x1080
aspect_ratio=original
engine_fps=60
vsync=1
fps_limit=60
upscaler=off
preset=1
frame_generation=0
show_fps=0
async_shaders=1
deferred_readback=1
stale_readback=1
frames_queued=1
